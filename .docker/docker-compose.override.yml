# Development overrides（API のホットリロード用）。
# Web は本番イメージのまま使う（override で next dev すると CSS Module parse failed になりやすい）。
#
# docker compose -f .docker/docker-compose.yml -f .docker/docker-compose.override.yml up -d --build api web
services:
  api:
    volumes:
      - ../api/app:/app/app
      - ../batch:/batch
      - ../secrets:/secrets
      - ../log:/app/log
    environment:
      BATCH_ROOT: /batch
      BATCH_LOG_PATH: /app/log/batch.log
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
