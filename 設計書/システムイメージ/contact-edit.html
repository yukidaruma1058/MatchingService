<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>担当者情報を編集 — MatchingService</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">MS</span>
        <div>
          <strong>MatchingService</strong>
          <small>システムイメージ</small>
        </div>
      </div>
      <nav class="nav">
        <a class="nav-item" href="index.html">ダッシュボード</a>
        <a class="nav-item" href="talents.html">人材一覧</a>
        <a class="nav-item" href="projects.html">案件一覧</a>
        <a class="nav-item" href="companies.html">企業一覧</a>
        <a class="nav-item is-active" href="contacts.html">担当者一覧</a>
        <a class="nav-item" href="matching.html">マッチング</a>
        <a class="nav-item" href="emails.html">メール取込</a>
        <a class="nav-item" href="settings.html">設定</a>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1>担当者情報を編集</h1>
          <p class="muted">田村 翔 ／ 株式会社クラウドネクスト</p>
        </div>
        <div class="topbar-actions">
          <a class="btn btn-secondary" href="contacts.html">キャンセル</a>
          <button class="btn btn-primary" type="submit" form="contact-edit-form">保存する（イメージ）</button>
        </div>
      </header>

      <p class="notice">
        氏名・メール・役割などを更新します。所属企業の変更はできません（別企業へ移す場合は新規追加後に無効化してください）。
      </p>

      <form id="contact-edit-form" class="detail-layout" action="contacts.html" method="get">
        <article class="detail-card">
          <h2>所属企業</h2>
          <dl class="kv">
            <dt>企業</dt>
            <dd><a href="company-detail.html">株式会社クラウドネクスト</a></dd>
            <dt>区分</dt>
            <dd><span class="badge badge-brand">案件配信</span></dd>
          </dl>
        </article>

        <article class="detail-card">
          <h2>担当者情報</h2>
          <div class="stack">
            <div class="field">
              <label for="name">氏名 <span class="required-mark">*</span></label>
              <input id="name" name="name" type="text" value="田村 翔" required />
            </div>
            <div class="field">
              <label for="email">メールアドレス <span class="required-mark">*</span></label>
              <input id="email" name="email" type="email" value="project-desk@cloudnext.example" required />
            </div>
            <div class="field">
              <label for="role">役割 <span class="required-mark">*</span></label>
              <select id="role" name="role" required>
                <option value="primary" selected>主担当</option>
                <option value="secondary">副担当</option>
              </select>
              <p class="muted field-hint">主担当は提案メールの宛先、副担当は CC に使われます。</p>
            </div>
            <div class="field">
              <label for="phone">電話番号</label>
              <input id="phone" name="phone" type="tel" value="03-5555-0101" />
            </div>
            <div class="field">
              <label for="notes">備考</label>
              <textarea id="notes" name="notes">平日 10–18時が連絡しやすい時間帯。</textarea>
            </div>
            <div class="toggle-row">
              <div class="toggle-copy">
                <strong>有効</strong>
                <span>OFF にすると送信先の選択肢から除外します。</span>
              </div>
              <label class="switch" title="有効">
                <input type="checkbox" name="is_active" checked />
                <span></span>
              </label>
            </div>
          </div>
        </article>
      </form>

      <section class="panel" style="margin-top:16px;">
        <div class="flow-links">
          <button class="btn btn-primary" type="submit" form="contact-edit-form">保存する（イメージ）</button>
          <a class="btn btn-ghost" href="contacts.html">担当者一覧へ</a>
          <a class="btn btn-ghost" href="company-detail.html">企業詳細へ</a>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
